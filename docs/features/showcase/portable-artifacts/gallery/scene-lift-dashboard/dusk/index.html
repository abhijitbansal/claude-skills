/* make-scene: the scene host and its chrome. Shared by the page and by embedders (make-explainer);

.sc-fallback { position: absolute; inset: 0; overflow: auto; padding: 16px; background: var(--page); color: var(--text); }
.sc-js[data-scene-state="loading"] .sc-fallback { visibility: hidden; }
.sc-table { margin: 0 0 16px; }
.sc-table table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }

.sc-table th, .sc-table td { padding: 4px 10px; border-bottom: 1px solid var(--line); text-align: left; overflow-wrap: anywhere; }
.sc-table th { color: var(--text-3); font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
.sc-fb-svg { margin: 0 0 16px; }
.sc-fb-svg svg { display: block; max-width: 100%; height: auto; }

.sc-fb-dark { display: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .sc-fb-light { display: none; }
  :root:not([data-theme="light"]) .sc-fb-dark { display: block; }

:root[data-theme="dark"] .sc-fb-light { display: none; }
:root[data-theme="dark"] .sc-fb-dark { display: block; }

.sc-btn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; color: var(--text-2); line-height: 1.3; transition: color .16s ease, background-color .16s ease, transform .16s cubic-bezier(.23,1,.32,1); }
