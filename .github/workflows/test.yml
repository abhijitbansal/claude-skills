name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: validate plugin manifests
        run: python3 scripts/validate_manifests.py .

      - name: install bats + shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core shellcheck tmux

      - name: install bats + shellcheck (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck tmux

      - name: install uv
        uses: astral-sh/setup-uv@v3

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install pytest
        run: uv tool install pytest

      - name: shellcheck
        run: shellcheck setup/*.sh plugins/ios-dev/skills/_lib/*.sh adapters/*.sh plugins/prompt-craft/hooks/*.sh plugins/core-workflow/hooks/*.sh tools/cache-clock/install.sh scripts/check_trailers.sh scripts/site-preview.sh

      - name: bats
        run: bats tests/bats/

      - name: pytest
        run: uv tool run pytest tests/pytest/ -q

      - name: pytest (second-wind)
        run: uv tool run pytest tools/second-wind/tests/ -q

  # cache-clock's Copilot CLI extension is a plain Node package with no dependencies.
  # (portable-artifacts moved to its own repo, which runs its own Node jobs.)
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: cache-clock (Copilot CLI extension, fake session)
        working-directory: tools/cache-clock
        run: node --test "test/*.test.mjs"

  # AGENTS.md trailer rule: no Claude-Session line and no model-named
  # Co-Authored-By in the PR's commits (the harness reminder asks for both).
  commit-trailers:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: forbid harness trailers in the PR's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check_trailers.sh "$(git merge-base "$BASE_SHA" "$HEAD_SHA")..$HEAD_SHA"

  # A plugin's plugin.json `version` is the ONLY update trigger — Claude Code
  # skips a plugin whose version string is unchanged, even when its code moved.
  # So: any PR that touches plugins/<name>/** must bump that plugin's version.
  # Escape hatch: put [skip-plugin-bump] in a commit message when the change
  # ships nothing to users. PR-only (a merge base is required to diff against).
  plugin-version-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: require plugin.json version bump for changed plugins
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/plugin_version_guard.py "$BASE_SHA" "$HEAD_SHA"
