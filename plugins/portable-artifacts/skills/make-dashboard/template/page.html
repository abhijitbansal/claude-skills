<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!--@GENERATOR-->
<!--@FAVICON-->
<title><!--@TITLE--></title>
<script>
// Apply the saved theme before first paint (no flash). Storage may throw.
(function () { try { var t = window.localStorage.getItem('pa-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
</script>
<style>
<!--@THEME-->
</style>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text); font: var(--fs-sm)/1.5 var(--font); /* dense UI: 1.5, not --lh-body (R13) */ -webkit-text-size-adjust: 100%; }
main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 0; }
.page-head { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
h1 { margin: 0; font: var(--display-weight) var(--fs-d2)/var(--lh-tight) var(--font-display); font-synthesis: none; /* press and mono ship a 400 display face only: no faux bold */ letter-spacing: var(--track-display); overflow-wrap: anywhere; }
.desc { margin: 6px 0 0; color: var(--text-2); }
.refreshed { margin: 0; color: var(--text-3); font-size: var(--fs-xs); }
.pa-footer { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; justify-content: space-between; max-width: 1168px; width: calc(100% - 32px); margin: 32px auto 48px; padding-top: 12px; border-top: 1px solid var(--line); }
.pa-provenance { margin: 0; color: var(--text-3); font-size: var(--fs-xs); line-height: 1.3; overflow-wrap: anywhere; }button { font: inherit; color: inherit; }
.theme-toggle { flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; color: var(--text-2); }
.theme-toggle:hover { color: var(--text); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
/* the tile is a size container so the value can be sized from the tile's width (cqi) and never spills */
.kpi { container-type: inline-size; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; box-shadow: var(--elev-1); }
/* tiles in a row stretch to one height; the Query line sits at the foot of each, level whether or not a tile has a trend */
.kpi > .kpi-sql { margin-top: auto; }
.kpi > :nth-last-child(2) { margin-bottom: 10px; }
/* the label is the shared caps style (.pa-caps from the theme's type rules); only its wrapping is set here */
.kpi-label { overflow-wrap: anywhere; }
/* the opt-in trend line (kpis[].trend): drawn in the accent, scaled to the tile, never wider than its drawing */
.kpi-trend { display: block; width: 100%; max-width: 160px; height: auto; margin-top: 8px; color: var(--accent); }
/* the whole value is one line ("87%", "1,204 ms"). --n (its character count, set by the builder) gives the
   size at which it just fills the tile: --kpi-fit = 100cqi / (n * 0.7em per character), never below --fs-md.
   --fs-lg is the cap. --n counts code points, so wide glyphs (CJK, emoji, capitals) can run wider than the
   0.7em assumption. A value longer than the builder's limit gets a wide tile (.kpi-wide). Alone in the grid
   a wide tile takes the full row. A section that holds one switches from the equal-track grid to wrapping
   flex rows whose tiles grow to fill the row, so a wide tile never leaves a hole beside short ones; the
   grid-column rule is the fallback where :has() is missing. The wide tile's basis is 18rem (288px), the
   narrowest section (a 320px viewport less the 16px page padding), so it is never narrower than that.
   A value too long for even that tile at --fs-md (.kpi-long, see KPI_LONG_CHARS in scripts/lib/html.mjs)
   cannot be one line: it wraps instead of spilling, at the same size. */
.kpi-wide { grid-column: 1 / -1; }
.kpis:has(.kpi-wide) { display: flex; flex-wrap: wrap; }
.kpis:has(.kpi-wide) > .kpi { flex: 1 1 160px; }
.kpis:has(.kpi-wide) > .kpi-wide { flex: 2 1 18rem; }
/* the numeral is set in the display face at its real weight (no faux bold), capped at the third display step */
.kpi-value { --kpi-fit: max(var(--fs-md), calc(100cqi / (var(--n, 8) * 0.7))); margin-top: 6px; font-family: var(--font-display); font-size: min(var(--fs-d3), var(--kpi-fit)); line-height: var(--lh-tight); font-weight: var(--display-weight); font-synthesis: none; font-variant-numeric: var(--num); white-space: nowrap; }
.kpi-long .kpi-value { white-space: normal; overflow-wrap: anywhere; }
.kpi-sql { font-size: var(--fs-xs); }
.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 900px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .card.full { grid-column: 1 / -1; }
}
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; box-shadow: var(--elev-1); }
/* a chart title is the chart's claim: the display face, a step above body text, balanced over its lines */
.card h2 { margin: 0 0 8px; font: var(--display-weight) var(--fs-md)/var(--lh-tight) var(--font-display); font-synthesis: none; text-wrap: balance; overflow-wrap: anywhere; }
/* One rule for every card's head: the title, then the view tabs and Export as one group flush left under it, so no
   card's tools drop to a row its sibling does not have. A full-width card on a wide page has room for both on one row. */
.card-head { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; margin-bottom: 8px; }
.card-head h2 { margin: 0; }
.card-tools { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
/* Two half cards side by side share their head row (subgrid), so their charts start level whatever their titles. */
@media (min-width: 900px) {
  .card.full .card-head { flex-direction: row; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 12px; }
  .card.full .card-tools { margin-left: auto; }
  @supports (grid-template-rows: subgrid) {
    .card { display: grid; grid-row: span 2; grid-template-rows: subgrid; row-gap: 8px; align-content: start; }
    .card .card-head { margin-bottom: 0; align-self: start; }
  }
}
.export { position: relative; margin: 0; border: 0; padding: 0; font-size: var(--fs-xs); }
.export summary { list-style: none; border: 1px solid var(--line); border-radius: 8px; padding: 2px 10px; color: var(--text-2); cursor: pointer; }
.export summary::-webkit-details-marker { display: none; }
.export .menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 2; display: grid; min-width: 96px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px; box-shadow: var(--elev-2); }
.export .menu button { border: 0; background: none; text-align: left; padding: 4px 8px; border-radius: 6px; cursor: pointer; color: var(--text); font: inherit; }
.export .menu button:hover { background: var(--accent-soft); }
.export .menu button[hidden] { display: none; }
.views { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px; }
.views button { border: 0; background: none; padding: 2px 10px; border-radius: 6px; font-size: var(--fs-xs); color: var(--text-2); cursor: pointer; }
.views button[aria-selected="true"] { background: var(--accent-soft); color: var(--text); }
.panes.pair { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 900px) { .panes.pair { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.table-view { max-height: 320px; overflow: auto; }
.table-view th button { border: 0; background: none; padding: 0; font: inherit; font-weight: var(--strong-weight); color: var(--text-2); cursor: pointer; }
.table-view th[aria-sort] button::after { content: attr(data-arrow); margin-left: 4px; }
.chart { position: relative; width: 100%; min-height: 120px; }
.chart .pa-pending { position: absolute; top: 0; left: 0; right: 0; visibility: hidden; }
.chart .vega-embed { width: 100%; display: block; }
.chart-error { color: var(--bad); font-size: var(--fs-sm); }
.meta { margin: 8px 0 0; color: var(--text-3); font-size: var(--fs-xs); }
details { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; font-size: var(--fs-sm); }
summary { cursor: pointer; color: var(--text-2); }
pre.sql { margin: 8px 0 0; padding: 10px 12px; background: var(--page); border-radius: 8px; overflow-x: auto; font: var(--fs-xs)/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.tablewrap { overflow-x: auto; margin-top: 6px; max-height: 280px; overflow-y: auto; }
table { border-collapse: collapse; font-size: var(--fs-xs); font-variant-numeric: var(--num); }
th, td { text-align: left; padding: 4px 12px 4px 0; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { color: var(--text-2); font-weight: var(--strong-weight); position: sticky; top: 0; background: var(--surface); }
th.num, td.num { text-align: right; padding: 4px 0 4px 12px; font-variant-numeric: var(--num); }
@media print { .kpi, .card, .export .menu { box-shadow: none; } }
</style>
<style><!--@TOGGLE_CSS--></style>
</head>
<body>
<main>
<header class="page-head">
<div>
<h1><!--@TITLE--></h1>
<!--@DESCRIPTION-->
</div>
<button type="button" class="theme-toggle" data-theme-toggle data-mode="auto" aria-label="Theme: Auto. Switch to Light" title="Theme: Auto. Switch to Light"><!--@TOGGLE_ICONS--></button>
<script><!--@TOGGLE_JS--></script>
</header>
<!--@KPIS-->
<!--@CARDS-->
</main>
<footer class="pa-footer"><p class="refreshed">Refreshed <!--@REFRESHED--></p><!--@PROVENANCE--></footer>
<script type="application/json" id="dash-data"><!--@DATA--></script>
<!--@VENDOR-->
<!--@RUNTIME-->
</body>
</html>
