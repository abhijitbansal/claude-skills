<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title><!--@TITLE--></title>
<script>
// Apply the saved theme before first paint (no flash). Storage may throw.
(function () { try { var t = window.localStorage.getItem('pa-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
</script>
<style>
<!--@THEME-->
</style>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text); font: 15px/1.5 var(--font); -webkit-text-size-adjust: 100%; }
main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
.page-head { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
h1 { margin: 0; font: 600 1.75rem/1.15 var(--font-display); letter-spacing: -0.01em; overflow-wrap: anywhere; }
.desc { margin: 6px 0 0; color: var(--text-2); }
.refreshed { margin: 6px 0 0; color: var(--text-3); font-size: 0.85rem; }
button { font: inherit; color: inherit; }
.theme-toggle { flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px 12px; cursor: pointer; color: var(--text-2); font-size: 0.85rem; }
.theme-toggle:hover { color: var(--text); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.kpi-label { color: var(--text-2); font-size: 0.85rem; }
.kpi-value { margin-top: 4px; font-size: 1.75rem; line-height: 1.15; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 900px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .card.full { grid-column: 1 / -1; }
}
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.card h2 { margin: 0 0 8px; font-size: 1rem; font-weight: 600; overflow-wrap: anywhere; }
.card-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
.card-head h2 { margin: 0; }
.views { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px; }
.views button { border: 0; background: none; padding: 2px 10px; border-radius: 6px; font-size: 0.8rem; color: var(--text-2); cursor: pointer; }
.views button[aria-selected="true"] { background: var(--accent-soft); color: var(--text); }
.panes.pair { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 900px) { .panes.pair { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.table-view { max-height: 320px; overflow: auto; }
.table-view th button { border: 0; background: none; padding: 0; font: inherit; font-weight: 600; color: var(--text-2); cursor: pointer; }
.table-view th[aria-sort] button::after { content: attr(data-arrow); margin-left: 4px; }
.chart { position: relative; width: 100%; min-height: 120px; }
.chart .pa-pending { position: absolute; top: 0; left: 0; right: 0; visibility: hidden; }
.chart .vega-embed { width: 100%; display: block; }
.chart-error { color: var(--bad); font-size: 0.85rem; }
.meta { margin: 8px 0 0; color: var(--text-3); font-size: 0.8rem; }
details { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; font-size: 0.85rem; }
summary { cursor: pointer; color: var(--text-2); }
pre.sql { margin: 8px 0 0; padding: 10px 12px; background: var(--page); border-radius: 8px; overflow-x: auto; font: 0.8rem/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.tablewrap { overflow-x: auto; margin-top: 6px; max-height: 280px; overflow-y: auto; }
table { border-collapse: collapse; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 4px 12px 4px 0; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { color: var(--text-2); font-weight: 600; position: sticky; top: 0; background: var(--surface); }
</style>
</head>
<body>
<main>
<header class="page-head">
<div>
<h1><!--@TITLE--></h1>
<!--@DESCRIPTION-->
<p class="refreshed">Refreshed <!--@REFRESHED--></p>
</div>
<button type="button" class="theme-toggle" data-theme-toggle aria-label="Theme: Auto. Change theme">Theme: Auto</button>
</header>
<!--@KPIS-->
<!--@CARDS-->
</main>
<script type="application/json" id="dash-data"><!--@DATA--></script>
<!--@VENDOR-->
<!--@RUNTIME-->
</body>
</html>
