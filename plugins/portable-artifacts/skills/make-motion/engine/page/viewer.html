<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>make-motion preview</title>
<style>
  :root { --ground: #111214; --panel: #1b1d21; --line: #2e3138; --ink: #e9e6df; --dim: #9a978f; --accent: #ffd34d; }
  html, body { margin: 0; background: var(--ground); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 16px; box-sizing: border-box; }
  #stage { display: block; width: 100%; height: auto; max-height: 72vh; object-fit: contain; background: #000; cursor: crosshair; }
  #errors { display: none; white-space: pre-wrap; font-family: ui-monospace, monospace; background: #3a1414; color: #ffd9d9; padding: 16px; border-radius: 6px; }
  body.invalid #errors { display: block; }
  body.invalid #film { display: none; }
  .bar { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  button { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  .track { position: relative; flex: 1 1 240px; min-width: 0; padding-top: 22px; }
  #scrub { width: 100%; margin: 0; accent-color: var(--accent); }
  #markers { position: absolute; top: 0; left: 0; right: 0; height: 20px; }
  #markers button { position: absolute; padding: 0 4px; font-size: 11px; line-height: 18px; border-radius: 3px; white-space: nowrap; max-width: 30%; overflow: visible; text-overflow: ellipsis; }
  #markers button::after { content: ''; position: absolute; left: 0; top: 100%; width: 1px; height: 6px; background: var(--accent); }
  #time { font-variant-numeric: tabular-nums; color: var(--dim); min-width: 11em; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--accent); color: #111; padding: 8px 14px; border-radius: 6px; font-family: ui-monospace, monospace; display: none; max-width: calc(100vw - 32px); overflow-wrap: anywhere; }
  #toast.on { display: block; }
  .notes { color: var(--dim); font-size: 12px; margin-top: 12px; }
  .notes p { margin: 4px 0; }
  footer { color: var(--dim); font-size: 12px; margin-top: 16px; border-top: 1px solid var(--line); padding-top: 8px; min-height: 1.4em; }
</style>
</head>
<body>
<main>
  <pre id="errors"></pre>
  <section id="film">
    <canvas id="stage" width="1920" height="1080"></canvas>
    <div class="bar">
      <button id="play" type="button">Play</button>
      <div class="track"><div id="markers"></div><input id="scrub" type="range" min="0" max="0" value="0" step="1" aria-label="frame"></div>
      <span id="time">0 / 0</span>
      <button id="mute" type="button">Mute</button>
    </div>
    <div class="notes">
      <p>Space plays and pauses, the arrow keys step one frame, M mutes. Click an element to copy its path in the film.</p>
      <p>Playback timing here is approximate; the MP4 is exact.</p>
      <p id="notice"></p>
    </div>
  </section>
  <footer id="provenance"></footer>
</main>
<div id="toast" role="status"></div>
<script type="module" src="/engine/page/stage.mjs"></script>
<script type="module" src="/engine/page/viewer.mjs"></script>
</body>
</html>
