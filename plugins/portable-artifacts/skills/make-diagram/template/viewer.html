<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="generator" content="make-diagram">
<title><!--@TITLE--></title>
<script>
// Apply the saved theme before first paint (no flash). Storage may throw.
(function () { try { var t = window.localStorage.getItem('pa-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
</script>
<style id="pa-theme-css">
<!--@THEME-->
</style>
<style id="pa-diagram-css">
<!--@DIAGRAM_CSS-->
</style>
<style>
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; background: var(--page); color: var(--text); font: 14px/1.4 var(--font); -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar { flex: none; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.titles { min-width: 0; }
h1 { margin: 0; font: 600 1.15rem/1.2 var(--font-display); letter-spacing: -0.01em; overflow-wrap: anywhere; }
.sub { margin: 2px 0 0; color: var(--text-2); font-size: 0.85rem; overflow-wrap: anywhere; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tools .group { display: inline-flex; gap: 4px; align-items: center; }
.tool { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; color: var(--text-2); font-size: 0.85rem; line-height: 1.3; }
.tool:hover:not(:disabled) { color: var(--text); }
.tool[aria-pressed="true"] { background: var(--accent-soft); color: var(--text); }
.tool:disabled { opacity: 0.6; cursor: default; }
.zoom-label { min-width: 3.2em; text-align: center; color: var(--text-3); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.export-error { flex: none; margin: 0; padding: 6px 16px; color: var(--bad); font-size: 0.85rem; border-bottom: 1px solid var(--line); background: var(--surface); }
.export-error[hidden] { display: none; }
.stage { position: relative; flex: 1 1 0; min-height: 0; overflow: hidden; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.stage.pa-grabbing { cursor: grabbing; }
.stage > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.caption { flex: none; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--surface); border-top: 1px solid var(--line); }
.caption[hidden] { display: none; }
.cap-text { min-width: 0; flex: 1 1 260px; }
.cap-count { margin: 0 0 2px; color: var(--text-3); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.cap-title { margin: 0; font: 600 1rem/1.3 var(--font-display); overflow-wrap: anywhere; }
.cap-note { margin: 4px 0 0; color: var(--text-2); overflow-wrap: anywhere; }
.cap-nav { display: flex; gap: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }
</style>
</head>
<body>
<header class="bar">
<div class="titles">
<h1><!--@TITLE--></h1>
<!--@SUBTITLE-->
</div>
<div class="tools" role="toolbar" aria-label="Diagram controls">
<span class="group" role="group" aria-label="View">
<button type="button" class="tool" data-act="fit" title="Fit to screen (F)">Fit</button>
<button type="button" class="tool" data-act="zoom-out" aria-label="Zoom out" title="Zoom out (-)">&minus;</button>
<span class="zoom-label" data-zoom-label aria-hidden="true">100%</span>
<button type="button" class="tool" data-act="zoom-in" aria-label="Zoom in" title="Zoom in (+)">+</button>
</span>
<button type="button" class="tool" data-act="present" aria-pressed="false" title="Step-by-step presentation (P)">Present</button>
<button type="button" class="tool" data-act="animate" aria-pressed="false" title="Animate edges (A)">Animate: Off</button>
<span class="group" role="group" aria-label="Export">
<button type="button" class="tool" data-export="svg" title="Download as SVG">SVG</button>
<button type="button" class="tool" data-export="png" title="Download as PNG">PNG</button>
</span>
<button type="button" class="tool" data-theme-toggle aria-label="Theme: Auto. Change theme">Theme: Auto</button>
<script>
// A stored theme was applied in <head>; label the toggle now, before the script below runs.
(function () { var t = document.documentElement.getAttribute('data-theme'), b = document.querySelector('[data-theme-toggle]'); if (t && b) { var l = 'Theme: ' + t.charAt(0).toUpperCase() + t.slice(1); b.textContent = l; b.setAttribute('aria-label', l + '. Change theme'); } })();
</script>
</div>
</header>
<p class="export-error" data-export-error role="alert" hidden></p>
<main class="stage" id="pa-stage">
<!--@SVG-->
</main>
<aside class="caption" data-pa-caption aria-label="Presentation caption" hidden>
<div class="cap-text" aria-live="polite">
<p class="cap-count" data-pa-count></p>
<h2 class="cap-title" data-pa-title></h2>
<p class="cap-note" data-pa-note hidden></p>
</div>
<div class="cap-nav">
<button type="button" class="tool" data-pa-prev>Back</button>
<button type="button" class="tool" data-pa-next>Next</button>
<button type="button" class="tool" data-pa-exit>Exit</button>
</div>
</aside>
<!--@TEXT-->
<script type="application/json" id="pa-data"><!--@DATA--></script>
<script><!--@CORE--></script>
<script><!--@CHROME--></script>
</body>
</html>
