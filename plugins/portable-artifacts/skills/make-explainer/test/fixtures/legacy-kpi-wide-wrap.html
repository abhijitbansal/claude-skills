:root{color-scheme:light;--page:#fbeee2;--surface:#fff8f0;--text:#2b1936;--text-2:#4a3556;--text-3:#6a5272;--line:#e8d3c2;--grid:#f1e2d3;--accent:#b5331b;--accent-soft:#f6ddd2;--warn:#8d5300;--good:#0a6e5a;--bad:#b3173a;--s1:#e8553a;--s2:#17a487;--s3:#e0a100;--s4:#8a4fc0;--s5:#3d7dd8;--s6:#d6407f;--s7:#5f7f12;--s8:#8b6d4a;--seq1:#fde0c8;--seq2:#ffb88a;--seq3:#f58564;--seq4:#e0566b;--seq5:#b94c86;--seq6:#6d3a8c;--seq7:#43245a;--k-person:#a3480a;--k-service:#0b6b8a;--k-data:#7a35b8;--k-queue:#0b7560;--k-external:#5a6675;--k-decision:#4338ca;--glow:#ff6b4a;--font-display:"Funnel Display", 'Avenir Next', 'Segoe UI', sans-serif;--font:"Host Grotesk", -apple-system, 'Segoe UI', sans-serif;--mono:"Commit Mono", ui-monospace, Menlo, Consolas, monospace}
:root{--fs-xs:12px;--fs-sm:14px;--fs-base:17px;--fs-md:21px;--fs-lg:27px;--fs-xl:34px;--fs-hero:clamp(40px, 6vw, 60px);--lh-body:1.6;--lh-head:1.15;--lh-hero:1.05;--track-display:-0.02em;--track-hero:-0.03em;--fs-display:clamp(2.5rem, 1.25rem + 4.2vw, 4.75rem);--fs-numeral:clamp(4.5rem, 2rem + 9vw, 9rem);--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;--sp-7:48px;--sp-8:72px;--sp-9:112px}
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--text); font: var(--fs-base)/var(--lh-body) var(--font); }
:root { --col: 52rem; --toc-w: 13.5rem; --toc-gap: 56px; --band-x: 16px; --band-y: 32px; --card-rule: 3px; }
.layout { max-width: 76rem; margin: 0 auto; padding: 8px 24px 96px; }
.sections { min-width: 0; max-width: var(--col); }
.sec + .sec { margin-top: 96px; }
.sec-alt { background: var(--surface); border-radius: 16px; padding: var(--band-y) var(--band-x); margin-inline: calc(-1 * var(--band-x)); }
/* inner surfaces drop to the page colour so they stay visible on the band (diagram.css and chart.css do the same) */
.sec-alt :is(.kpi, .card, .cmp-col, .tablewrap) { background: var(--page); }
.sec-title { position: relative; margin: 0 0 18px; max-width: 28em; font: 600 var(--fs-lg)/var(--lh-head) var(--font-display); letter-spacing: var(--track-display); text-wrap: balance; overflow-wrap: anywhere; scroll-margin-top: 24px; }
/* kpis */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); align-items: start; gap: 12px; margin: 0; }
/* the value leads each tile (visual order only), so values line up however long the labels are */
.kpi { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; min-width: 0; }
.kpi dt { color: var(--text-2); font-size: var(--fs-sm); }
.kpi dd { margin: 0; }
.kpi-value { order: -1; margin-bottom: 6px; font: 600 var(--fs-xl)/var(--lh-head) var(--font-display); letter-spacing: var(--track-display); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpi-delta { margin-top: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--tc, var(--text-2)); }
.kpi-note { margin-top: 6px; color: var(--text-3); font-size: var(--fs-xs); }
:root[data-flavor] { --r-card: 0px; --r-big: 0px; --rule-w: 1px; --head-weight: 700; --head-case: none; --head-track: -0.03em; --lh-hero: 0.95; --display: var(--fs-display); --grain-op: 0.07; }
:root[data-flavor="dusk"] { --r-card: 22px; --r-big: 40px; --head-track: -0.035em; --grain-op: 0.09; }
html[data-flavor] .kpis { gap: var(--sp-5); grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr)); }
:root[data-flavor="dusk"] .kpis { gap: var(--sp-3); }
html[data-flavor] .kpi { background: none; border: 0; border-top: var(--rule-w) solid var(--text); border-radius: 0; padding: var(--sp-3) 0 0; }
html[data-flavor] .kpi-value { margin-bottom: var(--sp-2); font-size: clamp(2.6rem, 1.6rem + 2.2vw, 4rem); line-height: 0.92; font-weight: var(--head-weight); letter-spacing: -0.04em; }
:root[data-flavor="poster"] .kpi-value { letter-spacing: 0; font-size: clamp(3rem, 2rem + 2.6vw, 4.8rem); }
html[data-flavor] .kpi:first-child .kpi-value { color: var(--accent); }
html[data-flavor] .kpi dt { font-family: var(--mono); font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.08em; }
:root[data-flavor="dusk"] .kpi { border: 0; border-radius: var(--r-card); padding: var(--sp-5); background: var(--surface); }
