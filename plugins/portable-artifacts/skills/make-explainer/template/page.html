<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="<!--@CSP-->">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title><!--@TITLE--></title>
<script>
// Before first paint: apply the saved theme (no flash; storage may throw) and, when motion
// is allowed, arm the one-time rise-in so sections never paint visible and then drop to
// hidden. If the runtime has not started after 2 s, disarm it so content is never stuck hidden.
(function () {
  var root = document.documentElement;
  try { var t = window.localStorage.getItem('pa-theme'); if (t === 'light' || t === 'dark') root.setAttribute('data-theme', t); } catch (e) {}
  var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!calm && 'IntersectionObserver' in window) {
    root.classList.add('rise-ready');
    window.setTimeout(function () { if (!window.paReady) root.classList.remove('rise-ready'); }, 2000);
  }
})();
</script>
<style>
<!--@THEME-->
</style>
<style>
<!--@BASECSS-->
</style>
</head>
<body class="<!--@BODYCLASS-->">
<a class="skip" href="#content">Skip to content</a>
<header class="masthead">
<div class="mast-text">
<h1><!--@H1--></h1>
<!--@SUBTITLE-->
<!--@META-->
</div>
<button type="button" class="theme-toggle" data-theme-toggle aria-label="Theme: Auto. Change theme">Theme: Auto</button>
<script>
// A stored theme was applied in <head>; label the toggle now, before the large scripts parse.
(function () { var t = document.documentElement.getAttribute('data-theme'), b = document.querySelector('[data-theme-toggle]'); if (t && b) { var l = 'Theme: ' + t.charAt(0).toUpperCase() + t.slice(1); b.textContent = l; b.setAttribute('aria-label', l + '. Change theme'); } })();
</script>
</header>
<div class="layout">
<!--@TOC-->
<main id="content" class="sections">
<!--@SECTIONS-->
</main>
</div>
<script>
<!--@PALIB-->
</script>
<script>
<!--@RUNTIME-->
</script>
</body>
</html>
