<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="<!--@CSP-->">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title><!--@TITLE--></title>
<script>
// Before first paint: apply the saved theme (no flash; storage may throw) and, when motion
// is allowed, arm the one-time rise-in so sections never paint visible and then drop to
// hidden. If the runtime has not started after 2 s, disarm it so content is never stuck hidden.
(function () {
  var root = document.documentElement;
  try { var t = window.localStorage.getItem('pa-theme'); if (t === 'light' || t === 'dark') root.setAttribute('data-theme', t); } catch (e) {}
  var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!calm && 'IntersectionObserver' in window) {
    root.classList.add('rise-ready');
    window.setTimeout(function () { if (!window.paReady) root.classList.remove('rise-ready'); }, 2000);
  }
})();
</script>
<style>
<!--@THEME-->
</style>
<style>
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--text); font: 1.0625rem/1.6 var(--font); }
button { font: inherit; color: inherit; }
a { color: var(--accent); text-underline-offset: 0.15em; }
code, pre, .path, .tl-date, .code-lang { font-family: var(--mono); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: 12px; top: -48px; z-index: 5; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; }
.skip:focus { top: 12px; }

/* tones: --tc is the colour a chip or card takes; it never carries meaning alone */
.tone-neutral { --tc: var(--text-2); }
.tone-accent { --tc: var(--accent); }
.tone-good { --tc: var(--good); }
.tone-warn { --tc: var(--warn); }
.tone-bad, .tone-high, .tone-critical { --tc: var(--bad); }
.tone-medium { --tc: var(--warn); }
.tone-low { --tc: var(--text-2); }

/* masthead */
.masthead { max-width: 76rem; margin: 0 auto; padding: 40px 24px 8px; display: flex; gap: 24px; align-items: flex-start; justify-content: space-between; }
.mast-text { min-width: 0; }
h1 { margin: 0; max-width: 22em; font: 600 clamp(1.9rem, 4.2vw, 2.9rem)/1.1 var(--font-display); letter-spacing: -0.015em; text-wrap: balance; overflow-wrap: anywhere; }
.subtitle { margin: 12px 0 0; max-width: 48ch; color: var(--text-2); font-size: 1.15rem; line-height: 1.45; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 20px; margin: 18px 0 0; padding: 0; font-size: 0.85rem; }
.meta div { display: flex; gap: 6px; }
.meta dt { color: var(--text-3); }
.meta dd { margin: 0; color: var(--text-2); overflow-wrap: anywhere; }
.meta .m-branch dd, .meta .m-repo dd, .meta .m-version dd { font-family: var(--mono); font-size: 0.8rem; }
.theme-toggle { flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px 12px; cursor: pointer; color: var(--text-2); font-size: 0.85rem; }
.theme-toggle:hover { color: var(--text); }

/* layout */
.layout { max-width: 76rem; margin: 0 auto; padding: 8px 24px 96px; }
.sections { min-width: 0; max-width: 52rem; }
@media (min-width: 1100px) {
  .has-toc .layout { display: grid; grid-template-columns: 13.5rem minmax(0, 1fr); gap: 56px; }
}
.toc { margin: 16px 0 0; }
.toc summary { cursor: pointer; color: var(--text-2); font-size: 0.85rem; padding: 6px 0; }
.toc ol { list-style: none; margin: 0; padding: 0; }
.toc a { display: block; padding: 5px 0; color: var(--text-2); text-decoration: none; font-size: 0.9rem; line-height: 1.35; }
.toc a:hover { color: var(--text); }
.toc a[aria-current="location"] { color: var(--accent); font-weight: 600; }
@media (min-width: 1100px) {
  .toc { position: sticky; top: 24px; align-self: start; max-height: calc(100vh - 48px); overflow: auto; margin-top: 28px; }
  .toc summary { cursor: default; list-style: none; text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.72rem; color: var(--text-3); pointer-events: none; }
  .toc summary::-webkit-details-marker { display: none; }
}

/* sections */
.sec { margin-top: 44px; padding-top: 32px; border-top: 1px solid var(--line); }
.sec:first-child { margin-top: 24px; }
.sec-tldr { border-top: 0; padding-top: 0; }
.sec-title { position: relative; margin: 0 0 18px; max-width: 28em; font: 600 1.55rem/1.25 var(--font-display); letter-spacing: -0.005em; text-wrap: balance; overflow-wrap: anywhere; scroll-margin-top: 24px; }
.sec { scroll-margin-top: 24px; }
.anchor { margin-left: 0.5em; color: var(--text-3); text-decoration: none; font-family: var(--font); font-weight: 400; font-size: 0.8em; opacity: 0; }
.sec-title:hover .anchor, .anchor:focus-visible { opacity: 1; }
@media (hover: none) { .anchor { display: none; } }
.prose > * { max-width: 68ch; }
.prose p, .prose ul { margin: 0 0 1em; }
.prose > :last-child { margin-bottom: 0; }
.prose ul { padding-left: 1.3em; }
.prose li + li { margin-top: 0.3em; }
.prose code, .lead code, li code, td code, th code, p code { background: var(--accent-soft); border-radius: 4px; padding: 0.05em 0.35em; font-size: 0.88em; overflow-wrap: anywhere; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px 1px 6px; border: 1px solid var(--tc, var(--line)); border-radius: 5px; color: var(--tc, var(--text-2)); font-size: 0.76rem; font-weight: 600; line-height: 1.5; white-space: nowrap; }
.gl { flex: none; }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 2px 10px; cursor: pointer; color: var(--text-2); font-size: 0.8rem; }
.btn:hover { color: var(--text); }

/* tldr */
.tldr { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 24px 28px; }
.tldr.tone-accent { border-color: var(--accent); }
.tldr-tone { margin: 0 0 12px; }
.lead { margin: 0; max-width: 46ch; font: 600 1.45rem/1.35 var(--font-display); text-wrap: pretty; }
.points { margin: 18px 0 0; padding-left: 1.2em; max-width: 60ch; }
.points li + li { margin-top: 0.4em; }
.sec-tldr .sec-title { font-size: 1.1rem; font-family: var(--font); color: var(--text-2); margin-bottom: 10px; }

/* kpis */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); gap: 12px; margin: 0; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.kpi dt { color: var(--text-2); font-size: 0.85rem; }
.kpi dd { margin: 0; }
.kpi-value { margin-top: 4px; font-size: 1.9rem; line-height: 1.15; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpi-delta { margin-top: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--tc, var(--text-2)); }
.kpi-note { margin-top: 6px; color: var(--text-3); font-size: 0.8rem; }

/* cards */
.cards { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 15rem), 1fr)); gap: 12px; }
@media (min-width: 760px) {
  .cards.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cards.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .cards.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.card.tone-accent { border-color: var(--accent); }
.card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 6px; }
.card-head h3 { margin: 0; font-size: 1rem; line-height: 1.3; font-weight: 600; flex: 1 1 8rem; min-width: 0; overflow-wrap: anywhere; }
.card-icon { color: var(--accent); flex: none; }
.card p { margin: 0 0 0.6em; font-size: 0.95rem; color: var(--text-2); }
.card p:last-child { margin-bottom: 0; }
.card ul { margin: 0; padding-left: 1.2em; font-size: 0.95rem; color: var(--text-2); }
.tag { border: 1px solid var(--line); border-radius: 5px; padding: 0 8px; color: var(--text-2); font-size: 0.74rem; line-height: 1.6; }

/* tables */
.tablewrap { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: auto; max-height: 32rem; }
table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.92rem; font-variant-numeric: tabular-nums; }
caption { caption-side: bottom; padding: 8px 14px; color: var(--text-3); font-size: 0.82rem; text-align: left; }
th, td { padding: 9px 14px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); min-width: 5.5rem; }
tbody tr:last-child > * { border-bottom: 0; }
thead th { position: sticky; top: 0; z-index: 1; background: var(--surface); color: var(--text-2); font-weight: 600; font-size: 0.82rem; }
tbody th { font-weight: 600; }
.a-r { text-align: right; }
.a-c { text-align: center; }
@media (max-width: 640px) {
  .risks { max-height: none; overflow: visible; border: 0; background: none; }
  .risks thead { display: none; }
  .risks table, .risks tbody, .risks tr, .risks td { display: block; }
  .risks tr { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; margin-bottom: 10px; }
  .risks td { border: 0; padding: 4px 0; min-width: 0; }
  .risks td:empty { display: none; }
  .risks td::before { content: attr(data-label); display: block; color: var(--text-3); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.05em; }
}

/* files */
.files { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.files-sum { margin: 0 0 10px; color: var(--text-2); font-size: 0.85rem; }
.tree { list-style: none; margin: 0; padding: 0; }
.tree .tree { margin: 2px 0 4px 10px; padding-left: 14px; border-left: 1px solid var(--line); }
.folder summary { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; cursor: pointer; padding: 3px 0; color: var(--text-2); }
.folder summary .gl { color: var(--text-3); }
.dir { font-family: var(--mono); font-size: 0.85rem; color: var(--text); overflow-wrap: anywhere; }
.count { color: var(--text-3); font-size: 0.78rem; }
.file { padding: 3px 0; }
.file-main { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.path { font-size: 0.85rem; overflow-wrap: anywhere; }
.stat { font-family: var(--mono); font-size: 0.78rem; color: var(--text-3); }
.stat .add { color: var(--good); }
.stat .del { color: var(--bad); }
.file-note { display: block; margin: 1px 0 0 0; color: var(--text-2); font-size: 0.88rem; max-width: 60ch; }

/* steps and timeline */
.steps { list-style: none; counter-reset: step; margin: 0; padding: 0; max-width: 68ch; }
.step { counter-increment: step; position: relative; padding: 0 0 18px 44px; }
.step::before { content: counter(step); position: absolute; left: 0; top: 0; width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); color: var(--text-2); font-size: 0.82rem; font-variant-numeric: tabular-nums; }
.step:last-child { padding-bottom: 0; }
.step-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; min-height: 28px; }
.step p { margin: 4px 0 0; color: var(--text-2); }
.timeline { list-style: none; margin: 0; padding: 0 0 0 22px; position: relative; max-width: 68ch; }
.timeline::before { content: ""; position: absolute; left: 4px; top: 8px; bottom: 8px; width: 1px; background: var(--line); }
.tl-item { position: relative; padding: 0 0 20px; }
.tl-item:last-child { padding-bottom: 0; }
.tl-item::before { content: ""; position: absolute; left: -22px; top: 7px; width: 9px; height: 9px; border: 1px solid var(--text-3); border-radius: 50%; background: var(--page); }
.tl-date { display: block; color: var(--text-3); font-size: 0.78rem; }
.tl-title { display: block; }
.tl-item p { margin: 2px 0 0; color: var(--text-2); }

/* compare */
.compare { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
@media (min-width: 760px) {
  .compare.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .compare.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
.cmp-col { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.cmp-col.tone-accent { border-color: var(--accent); }
.cmp-col h3 { margin: 0 0 8px; font-size: 1rem; font-weight: 600; overflow-wrap: anywhere; }
.cmp-col h3 + .chip { margin-bottom: 8px; }
.cmp-col ul { margin: 0; padding-left: 1.2em; color: var(--text-2); font-size: 0.95rem; }
.cmp-col li + li { margin-top: 0.35em; }
.verdict { margin: 16px 0 0; max-width: 68ch; }

/* callout, code, details, image */
.callout { background: var(--surface); border: 1px solid var(--tc); border-radius: 10px; padding: 14px 18px; max-width: 68ch; }
.callout-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin: 0 0 6px; }
.callout p { margin: 0 0 0.6em; }
.callout p:last-child, .callout ul:last-child { margin-bottom: 0; }
.code { margin: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.code-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 8px 6px 16px; border-bottom: 1px solid var(--line); min-height: 38px; }
.code-lang { color: var(--text-3); font-size: 0.78rem; }
.code pre { margin: 0; padding: 14px 16px; overflow: auto; font-size: 0.85rem; line-height: 1.55; tab-size: 2; }
.code pre code { background: none; padding: 0; font-size: inherit; overflow-wrap: normal; }
.code figcaption, .img figcaption { padding: 8px 16px 10px; color: var(--text-3); font-size: 0.82rem; border-top: 1px solid var(--line); }
.det { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; max-width: 68ch; }
.det summary { cursor: pointer; padding: 12px 16px; font-weight: 600; }
.det-body { padding: 0 16px 14px; }
.img { margin: 0; }
.img img { display: block; max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.img figcaption { padding: 8px 0 0; border: 0; max-width: 68ch; }

/* motion: one rise-in per section, only when the runtime enabled it */
.rise-ready .sec { opacity: 0; transform: translateY(10px); transition: opacity 0.5s ease, transform 0.5s ease; }
.rise-ready .sec.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  .rise-ready .sec { opacity: 1; transform: none; transition: none; }
}

@media (max-width: 640px) {
  .masthead { padding: 28px 16px 4px; gap: 12px; flex-wrap: wrap; }
  .layout { padding: 4px 16px 72px; }
  .tldr { padding: 18px 18px; }
  .lead { font-size: 1.25rem; }
  .sec-title { font-size: 1.35rem; }
}

@media print {
  :root { color-scheme: light; --page: #fff; --surface: #fff; --text: #000; --text-2: #333; --text-3: #555; --line: #bbb; --accent: #000; --accent-soft: #eee; }
  body { font-size: 11pt; }
  .theme-toggle, .toc, .copy, .anchor, .skip { display: none !important; }
  .layout, .has-toc .layout { display: block; padding: 0; }
  .masthead { padding: 0 0 8px; }
  .rise-ready .sec { opacity: 1; transform: none; transition: none; }
  .sec { break-inside: auto; margin-top: 24px; padding-top: 16px; }
  .sec-title, .kpi, .card, .cmp-col, .step, .tl-item, .callout, .code, .file, tr { break-inside: avoid; }
  .sec-title { break-after: avoid; }
  .tablewrap, .code pre { max-height: none; overflow: visible; }
  .code pre { white-space: pre-wrap; }
  a { color: inherit; }
}
</style>
</head>
<body class="<!--@BODYCLASS-->">
<a class="skip" href="#content">Skip to content</a>
<header class="masthead">
<div class="mast-text">
<h1><!--@H1--></h1>
<!--@SUBTITLE-->
<!--@META-->
</div>
<button type="button" class="theme-toggle" data-theme-toggle aria-label="Theme: Auto. Change theme">Theme: Auto</button>
<script>
// A stored theme was applied in <head>; label the toggle now, before the large scripts parse.
(function () { var t = document.documentElement.getAttribute('data-theme'), b = document.querySelector('[data-theme-toggle]'); if (t && b) { var l = 'Theme: ' + t.charAt(0).toUpperCase() + t.slice(1); b.textContent = l; b.setAttribute('aria-label', l + '. Change theme'); } })();
</script>
</header>
<div class="layout">
<!--@TOC-->
<main id="content" class="sections">
<!--@SECTIONS-->
</main>
</div>
<script>
<!--@PALIB-->
</script>
<script>
<!--@RUNTIME-->
</script>
</body>
</html>
